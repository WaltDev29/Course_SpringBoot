<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Form</title>
</head>
<body>
<h3>회원가입</h3>
<form action="/member" method="post">
    <label>아이디 : <input type="text" name="id" id="id"></label><br>
    <label>비밀번호 : <input type="password" name="passwd" id="passwd"></label><br>
    <label>거주지 : <select name="city" id="city">
        <option value="서울시">서울시</option>
        <option value="경기도">경기도</option>
        <option value="인천시">인천시</option>
        <option value="충청도">충청도</option>
        <option value="전라도">전라도</option>
        <option value="경상도">경상도</option>
    </select></label><br>

    <label>성별 :
        <input type="radio" name="gender" value="male" checked>남성
        <input type="radio" name="gender" value="female">여성
    </label><br>
    <label>취미 :
        <input type="checkbox" name="hobby" value="독서" checked>독서
        <input type="checkbox" name="hobby" value="운동">운동
        <input type="checkbox" name="hobby" value="영화">영화
    </label><br>
    <label><textarea name="greetings" id="greetings" cols="30" rows="3" placeholder="가입 인사를 입력해주세요"></textarea></label>
    <label>
        <button type="submit">가입하기</button>
        <button type="reset">다시쓰기</button>
    </label>
</form>
</body>
</html>
