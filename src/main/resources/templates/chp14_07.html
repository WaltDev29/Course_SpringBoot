<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chap14-JPA-First-Exam</title>
</head>
<body>
<div align="center">
    <h3>JPA 데이터베이스 실습3</h3>
    <a th:href="@{/exam14_03/new}">Member 데이터 삽입</a> <br>
    <br>
    <table border="1" cellpadding="10">
        <tr>
            <th>아이디</th>
            <th>이름</th>
            <th>가격</th>
        </tr>
        <tr th:each="product : ${product2List}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.price}"></td>
            <td><a th:href="@{'/exam14_03/edit/' + ${product.id}}">Edit</a>&nbsp;&nbsp;&nbsp;&nbsp;
                <a th:onclick="deleteProduct([[${product.id}]]); return false">Delete</a>
            </td>
        </tr>
    </table>

    <table border="1" cellpadding="10">
        <tr>
            <th>아이디</th>
            <th>특징</th>
            <th>무게</th>
            <th>너비</th>
            <th>높이</th>
        </tr>
        <tr th:each="detail : ${detailList}">
            <td th:text="${detail.id}"></td>
            <td th:text="${detail.description}"></td>
            <td th:text="${detail.weight}"></td>
            <td th:text="${detail.width}"></td>
            <td th:text="${detail.height}"></td>
            <td><a th:href="@{'/exam14_03/edit/' + ${detail.id}}">Edit</a></td>
        </tr>
    </table>
</div>

<script>
    function deleteProduct(id) {
        if (confirm("해당 제품을 삭제하시겠습니까?")) {
            location.href = "/exam14_03/delete/" + id;
        }
    }
</script>
</body>
</html>
